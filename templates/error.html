{% extends "base.html" %}
{% block title %}Error {{ code }} — Factify{% endblock %}
{% block content %}
<section class="py-5">
  <div class="container text-center" style="max-width:680px">
    <div class="mx-auto d-flex align-items-center justify-content-center rounded-3 mb-3" style="width:64px;height:64px;background:#FEF2F2;color:#DC2626"><i class="bi bi-exclamation-triangle fs-3"></i></div>
    <h2 class="fw-bolder">{{ code }} — {{ message }}</h2>
    <p class="text-muted">The page you requested couldn’t be found or an error occurred. Try going back home or running a new check.</p>
    <div class="d-flex justify-content-center gap-2 mt-3">
      <a href="/" class="btn btn-dark rounded-pill">Go Home</a>
      <a href="/factchecks" class="btn btn-ghost rounded-pill">Fact Check</a>
    </div>
  </div>
</section>
{% endblock %}
